services:
  - type: web
    name: youtube-orchestrator
    env: docker
    plan: free
    buildCommand: docker build -t app .
    startCommand: uvicorn main:app --host 0.0.0.0 --port 80
    envVars:
      - key: PORT
        value: 80
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
